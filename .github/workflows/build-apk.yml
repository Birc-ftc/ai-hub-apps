name: Build GenieX Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - release
      - "release/**"
      - main

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Accept Android SDK Licenses and Install NDK
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name "sdkmanager" | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Locate Android Project Directory
        id: find_project
        run: |
          if [ -f "geniex_chat_android/settings.gradle" ] || [ -f "geniex_chat_android/settings.gradle.kts" ]; then
            PROJECT_DIR="geniex_chat_android"
          elif [ -f "apps/geniex_chat_android/settings.gradle" ] || [ -f "apps/geniex_chat_android/settings.gradle.kts" ]; then
            PROJECT_DIR="apps/geniex_chat_android"
          elif [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            GRADLE_SETTINGS=$(find . -maxdepth 4 -name "settings.gradle*" | grep -i "genie" | head -n 1)
            if [ -z "$GRADLE_SETTINGS" ]; then
              GRADLE_SETTINGS=$(find . -maxdepth 4 -name "settings.gradle*" | head -n 1)
            fi
            PROJECT_DIR=$(dirname "$GRADLE_SETTINGS")
          fi
          echo "Found project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Assemble Debug APK
        working-directory: ${{ steps.find_project.outputs.dir }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenieX-Chat-Debug-APK
          path: ${{ steps.find_project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
