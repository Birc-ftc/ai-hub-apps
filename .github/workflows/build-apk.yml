name: Build GenieX Chat APK

on:
  # Actions sekmesinden tek tıkla manuel başlatma imkanı sağlar
  workflow_dispatch:
  # İlgili dallara yeni kod gönderildiğinde otomatik çalışır
  push:
    branches:
      - release
      - "release/**"
      - main

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu ve Alt Modülleri İndir (Checkout)
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Android SDK ve NDK Ortamını Hazırla
        uses: android-actions/setup-android@v3

      - name: Gerekli NDK ve CMake Paketlerini Doğrula
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Android Proje Dizinini Otomatik Tespit Et
        id: find_project
        run: |
          if [ -f "geniex_chat_android/settings.gradle" ] || [ -f "geniex_chat_android/settings.gradle.kts" ]; then
            PROJECT_DIR="geniex_chat_android"
          elif [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            GRADLE_SETTINGS=$(find . -maxdepth 4 -name "settings.gradle*" | grep -i "genie" | head -n 1)
            if [ -z "$GRADLE_SETTINGS" ]; then
              GRADLE_SETTINGS=$(find . -maxdepth 4 -name "settings.gradle*" | head -n 1)
            fi
            PROJECT_DIR=$(dirname "$GRADLE_SETTINGS")
          fi
          echo "Bulunan proje dizini: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Gradle Wrapper ve İzinleri Ayarla
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew bulunamadı, otomatik oluşturuluyor..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Debug APK Derle (Assemble Debug)
        working-directory: ${{ steps.find_project.outputs.dir }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Üretilen APK Dosyasını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GenieX-Chat-Debug-APK
          path: ${{ steps.find_project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
